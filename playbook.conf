<?xml version="1.0" encoding="utf-8"?>

<Playbook>
        <Name>ilyOS</Name>
        <Username>ilymaiki</Username>
        <ShortDescription>ilyOS Playbook for Windows 11</ShortDescription>
        <Title>ilyOS</Title>
        <Description>Official ilyOS Playbook for Windows 11</Description>
        <Details>Official ilyOS Playbook for Windows 11</Details>
        <Version>1.0</Version>
        <SupportedBuilds>
                <!-- 24H2 -->
                <string>26100</string>
                <!-- 25H2 -->
                <string>26200</string>
                <!-- 26H2 -->
                <string>26300</string>
        </SupportedBuilds>
        <UniqueId>d006382f-8c70-4bf2-ac0e-4b5f8a1457d6</UniqueId>
        <Git>https://github.com/ilymaiki/ilyOS</Git>
        <Software>
                <Package Option="browser-chrome" DefaultWebBrowser="true">
                        <Name>googlechrome</Name>
                        <Title>Chrome</Title>
                        <Description>Standard Google Chrome browser.</Description>
                        <Icon>chrome.png</Icon>
                </Package>
                <Package Option="browser-brave" DefaultWebBrowser="true">
                        <Name>brave</Name>
                        <Title>Brave</Title>
                        <Description>Privacy-focused browser with built-in ad blocking.</Description>
                        <Icon>brave.png</Icon>
                </Package>
                <Package Option="browser-ugc" DefaultWebBrowser="true">
                        <Name>ugc</Name>
                        <Title>Chromium (UGC)</Title>
                        <Description>Chromium without Google background, configured by AME.</Description>
                        <Icon>chromium.png</Icon>
                </Package>
        </Software>
        <FeaturePages>
                <RadioImagePage CheckDefaultBrowser="true" DefaultOption="browser-chrome" IsRequired="true" Description="Choose the browser to install. If you do not want a new one, select 'None' to keep Edge.">
                        <TopLine Text="Chromium uses the AME configuration."/>
                        <Options>
                                <RadioImageOption>
                                        <Text>Chrome</Text>
                                        <Name>browser-chrome</Name>
                                        <FileName>chrome</FileName>
                                        <GradientTopColor>#FF3647</GradientTopColor>
                                        <GradientBottomColor>#FFC742</GradientBottomColor>
                                </RadioImageOption>
                                <RadioImageOption>
                                        <Text>Brave</Text>
                                        <Name>browser-brave</Name>
                                        <FileName>brave</FileName>
                                        <GradientTopColor>#A33401</GradientTopColor>
                                        <GradientBottomColor>#FFC481</GradientBottomColor>
                                </RadioImageOption>
                                <RadioImageOption>
                                        <Text>Chromium</Text>
                                        <Name>browser-ugc</Name>
                                        <FileName>chromium</FileName>
                                        <GradientTopColor>#14305E</GradientTopColor>
                                        <GradientBottomColor>#3577E6</GradientBottomColor>
                                </RadioImageOption>
                                <RadioImageOption None="true"/>
                        </Options>
                </RadioImagePage>
        </FeaturePages>
</Playbook>